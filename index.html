<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のひとりごと</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Z017HF17EP"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-Z017HF17EP');</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:#EBF6FB;color:#1A3A4A;min-height:100vh;}

header{background:white;border-bottom:1px solid #D0EAF5;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.logo{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:1.2rem;color:#1A3A4A;}
.logo span{color:#3A9DBB;}
.live-badge{display:flex;align-items:center;gap:0.4rem;font-size:0.7rem;color:#3A9DBB;font-weight:700;}
.pulse{width:8px;height:8px;border-radius:50%;background:#3A9DBB;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(1.4);}}

.page{max-width:560px;margin:0 auto;padding:1.5rem 1.2rem 5rem;}

/* 投稿フォーム */
.compose{background:white;border-radius:16px;padding:1.2rem 1.4rem;box-shadow:0 2px 16px rgba(58,157,187,0.1);margin-bottom:1.5rem;border:1px solid #D0EAF5;}
.compose-top{display:flex;gap:0.8rem;align-items:flex-start;}
.avatar{width:40px;height:40px;border-radius:50%;background:#A8DCF0;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
.compose-input{width:100%;}
.compose-textarea{width:100%;border:none;outline:none;font-size:0.95rem;font-family:'Noto Sans JP',sans-serif;color:#1A3A4A;resize:none;min-height:80px;line-height:1.7;background:transparent;}
.compose-textarea::placeholder{color:#A8D0E0;}
.compose-footer{display:flex;justify-content:space-between;align-items:center;margin-top:0.8rem;padding-top:0.8rem;border-top:1px solid #EBF6FB;}
.char-count{font-size:0.72rem;color:#A8D0E0;}
.char-count.warn{color:#E8891A;}
.post-btn{padding:0.5rem 1.4rem;background:#3A9DBB;color:white;border:none;border-radius:20px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.85rem;font-weight:700;cursor:pointer;transition:background .1s;}
.post-btn:hover{background:#2A7D9B;}
.post-btn:disabled{opacity:0.5;cursor:not-allowed;}

/* タイムライン */
.timeline-label{font-size:0.72rem;color:#7AAABB;font-weight:700;letter-spacing:0.1em;margin-bottom:0.8rem;}
.card{background:white;border-radius:16px;padding:1.1rem 1.4rem;box-shadow:0 2px 12px rgba(58,157,187,0.08);margin-bottom:0.9rem;border:1px solid #D0EAF5;animation:fadein .3s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.card-head{display:flex;align-items:center;gap:0.6rem;margin-bottom:0.6rem;}
.card-avatar{width:32px;height:32px;border-radius:50%;background:#A8DCF0;display:flex;align-items:center;justify-content:center;font-size:0.85rem;flex-shrink:0;}
.card-time{font-size:0.65rem;color:#7AAABB;}
.card-text{font-size:0.88rem;color:#1A3A4A;line-height:1.8;white-space:pre-wrap;}
.card-foot{display:flex;justify-content:flex-end;margin-top:0.8rem;}
.like-btn{display:flex;align-items:center;gap:0.3rem;font-size:0.72rem;color:#7AAABB;border:1px solid #D0EAF5;padding:3px 10px;border-radius:20px;cursor:pointer;background:none;font-family:'Noto Sans JP',sans-serif;transition:all .1s;}
.like-btn:hover{border-color:#3A9DBB;color:#3A9DBB;background:#EBF6FB;}
.like-btn.voted{border-color:#A8DCF0;color:#3A9DBB;background:#EBF6FB;cursor:default;opacity:0.7;}

.empty{text-align:center;padding:3rem 1rem;color:#A8D0E0;font-size:0.85rem;line-height:2.2;}
.loading{text-align:center;padding:2rem;color:#A8D0E0;font-size:0.82rem;}

.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);background:#1A3A4A;color:white;padding:0.6rem 1.4rem;border-radius:20px;font-size:0.82rem;z-index:100;transition:transform .28s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <div class="logo">今日の<span>ひとりごと</span></div>
  <div class="live-badge"><div class="pulse"></div>LIVE</div>
</header>

<div class="page">
  <div class="compose">
    <div class="compose-top">
      <div class="avatar">💭</div>
      <div class="compose-input">
        <textarea class="compose-textarea" id="f-ep" placeholder="今日のひとりごとを書いてみよう..." maxlength="200" oninput="updateChar()"></textarea>
      </div>
    </div>
    <div class="compose-footer">
      <span class="char-count" id="char-count">0 / 200</span>
      <button class="post-btn" id="post-btn" onclick="submitPost()">投稿する</button>
    </div>
  </div>

  <div class="timeline-label">// みんなのひとりごと</div>
  <div id="posts"><div class="loading">読み込み中...</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://bujdylzpyefppgytjjru.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1amR5bHpweWVmcHBneXRqanJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MjQzMDksImV4cCI6MjA5NjUwMDMwOX0.kiFqqtg5WBtKTv3J13cMW6lN7o3Q-JuVLDtwUDvIwp8';
const H={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};

// QRトラッキング
function getVisitorId(){let id=localStorage.getItem('visitor_id');if(!id){id=crypto.randomUUID();localStorage.setItem('visitor_id',id);}return id;}
async function trackQR(){
  const params=new URLSearchParams(window.location.search);
  if(params.get('utm_source')!=='qr')return;
  await fetch(SUPABASE_URL+'/rest/v1/qr_access',{
    method:'POST',
    headers:{...H,'Prefer':'return=minimal'},
    body:JSON.stringify({site:'hitorigoto',visitor_id:getVisitorId()})
  }).catch(()=>{});
}
trackQR();

// 文字数カウント
function updateChar(){
  const val=document.getElementById('f-ep').value;
  const el=document.getElementById('char-count');
  el.textContent=val.length+' / 200';
  el.className='char-count'+(val.length>180?' warn':'');
}

// 投稿
async function submitPost(){
  const ep=document.getElementById('f-ep').value.trim();
  if(!ep){toast('⚠ ひとりごとを入力してください');return;}
  const btn=document.getElementById('post-btn');
  btn.disabled=true;btn.textContent='投稿中...';
  try{
    const res=await fetch(SUPABASE_URL+'/rest/v1/hitorigoto',{
      method:'POST',
      headers:{...H,'Prefer':'return=representation'},
      body:JSON.stringify({episode:ep})
    });
    if(!res.ok)throw new Error();
    document.getElementById('f-ep').value='';
    updateChar();
    await loadPosts();
    window.scrollTo({top:0,behavior:'smooth'});
    toast('✅ 投稿しました！');
  }catch(e){toast('⚠ 投稿に失敗しました。');}
  finally{btn.disabled=false;btn.textContent='投稿する';}
}

// 投稿読み込み（3秒ごとにリアルタイム更新）
let lastId=0;
async function loadPosts(){
  try{
    const res=await fetch(SUPABASE_URL+'/rest/v1/hitorigoto?order=created_at.desc&limit=50',{headers:H});
    const data=await res.json();
    if(!Array.isArray(data))return;
    if(data.length>0)lastId=data[0].id;
    render(data);
  }catch(e){document.getElementById('posts').innerHTML='<div class="empty">読み込みに失敗しました。</div>';}
}

async function pollPosts(){
  try{
    const res=await fetch(SUPABASE_URL+'/rest/v1/hitorigoto?order=created_at.desc&limit=50',{headers:H});
    const data=await res.json();
    if(!Array.isArray(data))return;
    if(data.length>0&&data[0].id!==lastId){lastId=data[0].id;render(data);}
  }catch(e){}
}

function render(posts){
  const el=document.getElementById('posts');
  if(!posts.length){el.innerHTML='<div class="empty">まだひとりごとがありません。<br>最初の一言を投稿してみよう。</div>';return;}
  const emojis=['💭','🌙','☁️','✨','🌊','🍃','💫','🌸'];
  el.innerHTML=posts.map((p,i)=>{
    const t=new Date(p.created_at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const emoji=emojis[p.id%emojis.length];
    return`<div class="card">
      <div class="card-head">
        <div class="card-avatar">${emoji}</div>
        <span class="card-time">${t}</span>
      </div>
      <div class="card-text">${esc(p.episode)}</div>
      <div class="card-foot">
        <button class="like-btn" onclick="like(${p.id},this)">♡ ${p.helpful}</button>
      </div>
    </div>`;
  }).join('');
}

async function like(id,btn){
  if(btn.classList.contains('voted'))return;
  btn.classList.add('voted');
  try{
    const res=await fetch(SUPABASE_URL+'/rest/v1/hitorigoto?id=eq.'+id+'&select=helpful',{headers:H});
    const data=await res.json();
    await fetch(SUPABASE_URL+'/rest/v1/hitorigoto?id=eq.'+id,{
      method:'PATCH',headers:{...H,'Prefer':'return=minimal'},
      body:JSON.stringify({helpful:(data[0]?.helpful??0)+1})
    });
    await loadPosts();
  }catch(e){}
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}

loadPosts();
setInterval(pollPosts,3000);
</script>
</body>
</html>
